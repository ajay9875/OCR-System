{% extends "base.html" %}

{% block title %}User Login | AI Course Recommendation{% endblock %}

{% block extra_css %}
<style>
  .login-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 3rem 5%;
    min-height: calc(100vh - 200px);
  }

  .login-card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 24px;
    padding: 2.5rem 2rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.12);
    border: 1px solid #eef2f6;
  }

  .login-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .login-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #dbeafe, #ede9fe);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1rem;
  }

  .login-icon i {
    font-size: 1.8rem;
    color: #2563eb;
  }

  .login-header h2 {
    font-size: 1.7rem;
    font-weight: 800;
    color: #0b1e3a;
    letter-spacing: -0.02em;
    margin-bottom: 0.35rem;
  }

  .login-header p {
    color: #64748b;
    font-size: 0.95rem;
  }

  .form-group {
    margin-bottom: 1.2rem;
  }

  .form-group label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    color: #334155;
    margin-bottom: 0.4rem;
  }

  .input-wrap {
    position: relative;
  }

  .input-wrap i {
    position: absolute;
    top: 50%;
    left: 14px;
    transform: translateY(-50%);
    color: #94a3b8;
    font-size: 0.95rem;
  }

  .form-control {
    width: 100%;
    padding: 0.8rem 1rem 0.8rem 2.6rem;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    font-size: 0.98rem;
    font-family: inherit;
    color: #1e293b;
    background: #f8fafc;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    outline: none;
  }

  .form-control:focus {
    border-color: #2563eb;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
  }

  .btn-submit {
    width: 100%;
    padding: 0.9rem;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-weight: 700;
    font-size: 1rem;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 10px 20px -8px rgba(37, 99, 235, 0.5);
    margin-top: 0.5rem;
  }

  .btn-submit:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
    box-shadow: 0 12px 22px -8px #1d4ed8;
  }

  .btn-submit:active { transform: translateY(0); }

  .login-links {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    margin-top: 1.5rem;
    text-align: center;
  }

  .login-links a {
    text-decoration: none;
    font-size: 0.9rem;
    color: #475569;
    font-weight: 500;
    transition: color 0.2s;
  }

  .login-links a:hover { color: #2563eb; }

  .login-links .newuser {
    font-weight: 700;
    color: #2563eb;
  }

  .login-links .newuser:hover { text-decoration: underline; }

  .divider {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin: 1rem 0 0.2rem;
    color: #cbd5e1;
    font-size: 0.8rem;
  }
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e2e8f0;
  }

  @media (max-width: 480px) {
    .login-card { padding: 2rem 1.5rem; border-radius: 20px; }
    .login-header h2 { font-size: 1.4rem; }
  }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-card">

    <div class="login-header">
      <div class="login-icon">
        <i class="fas fa-user-shield"></i>
      </div>
      <h2>User Login</h2>
      <p>Welcome back! Please sign in to continue.</p>
    </div>

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="username">Email or Username</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" id="username" name="username"
                 class="form-control" placeholder="Enter email or username"
                 required autocomplete="username" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" name="password"
                 class="form-control" placeholder="Enter your password"
                 required autocomplete="current-password" />
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fas fa-sign-in-alt" style="margin-right: 6px;"></i> Sign In
      </button>

      <div class="login-links">
        <a href="/forgetpass">Forgot password?</a>
        <a href="/forgot_username">Forgot username?</a>
        <div class="divider">or</div>
        <a href="/register" class="newuser">
          <i class="fas fa-user-plus" style="margin-right: 4px;"></i>
          Create a new account
        </a>
      </div>
    </form>

  </div>
</div>
{% endblock %}
